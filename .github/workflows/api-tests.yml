name: HW06 API Smoke

on:
  push:
    branches:
      - main
      - hw6-tanh
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-smoke:
    name: Backend smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Start backend
        run: |
          node backend/server.js > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for products API and require HTTP 200
        shell: bash
        run: |
          for attempt in {1..30}; do
            status="$(curl --silent --output products-response.json --write-out '%{http_code}' http://127.0.0.1:3000/api/products || true)"
            if [ "$status" = "200" ]; then
              echo "Backend smoke test passed with HTTP 200."
              exit 0
            fi
            echo "Attempt $attempt/30 returned HTTP ${status:-unavailable}; retrying..."
            sleep 1
          done

          echo "Backend did not return HTTP 200 within 30 seconds."
          cat backend.log
          exit 1

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-smoke-log
          path: backend.log
          if-no-files-found: ignore
