name: HW06 API Tests

on:
  push:
    branches:
      - main
      - hw6-tanh
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-smoke:
    name: Backend smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Start backend
        run: |
          node backend/server.js > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for products API and require HTTP 200
        shell: bash
        run: |
          for attempt in {1..30}; do
            status="$(curl --silent --output products-response.json --write-out '%{http_code}' http://127.0.0.1:3000/api/products || true)"
            if [ "$status" = "200" ]; then
              echo "Backend smoke test passed with HTTP 200."
              exit 0
            fi
            echo "Attempt $attempt/30 returned HTTP ${status:-unavailable}; retrying..."
            sleep 1
          done

          echo "Backend did not return HTTP 200 within 30 seconds."
          cat backend.log
          exit 1

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-smoke-log
          path: backend.log
          if-no-files-found: ignore

  newman-full-suite:
    name: Newman full suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            api-tests/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix api-tests

      - name: Start backend
        run: |
          node backend/server.js > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for API readiness
        shell: bash
        run: |
          for attempt in {1..30}; do
            status="$(curl --silent --output products-response.json --write-out '%{http_code}' http://127.0.0.1:3000/api/products || true)"
            if [ "$status" = "200" ]; then
              echo "Backend is ready with HTTP 200."
              exit 0
            fi
            echo "Attempt $attempt/30 returned HTTP ${status:-unavailable}; retrying..."
            sleep 1
          done

          echo "Backend did not become ready within 30 seconds."
          cat backend.log
          exit 1

      - name: Run full Newman suite and sanitize reports
        shell: bash
        run: |
          mkdir -p postman/reports/ci
          set +e
          node api-tests/node_modules/newman/bin/newman.js run postman/HW06_API_Testing.postman_collection.json \
            -e postman/HW06_LOCAL.postman_environment.json \
            --env-var studentId=23127280 \
            --reporters cli,htmlextra,json \
            --reporter-htmlextra-export postman/reports/ci/newman.html \
            --reporter-json-export postman/reports/ci/newman.raw.json
          newman_status=$?
          set -e

          node api-tests/scripts/analyze-newman.js \
            postman/reports/ci/newman.raw.json \
            postman/reports/ci/newman-summary.json
          node api-tests/scripts/sanitize-newman-reports.js \
            postman/reports/ci/newman.html \
            postman/reports/ci/newman-summary.json
          rm -f postman/reports/ci/newman.raw.json
          exit "$newman_status"

      - name: Upload sanitized Newman evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw06-newman-report
          path: |
            postman/reports/ci/newman.html
            postman/reports/ci/newman-summary.json
            backend.log
          if-no-files-found: warn
          retention-days: 14
