$kind: http-request
name: CPN-AI-012 | Ensure role=admin in request body cannot elevate a regular-user token.
url: "{{baseUrl}}/api/admin/coupons"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{userToken}}
body:
  type: json
  content: '{"code":"HW06A012_{{runId}}","type":"percent","discount_value":10,"min_order_amount":0,"expired_at":"2099-12-31","max_uses_per_user":1,"role":"admin"}'
scripts:
  - type: afterResponse
    code: |-
      const testId = "CPN-AI-012";
      const allowedCodes = [403];
      pm.test(testId + ' | expected HTTP status', () => pm.expect(allowedCodes).to.include(pm.response.code));
      pm.test(testId + ' | X-Student-Id sent', () => pm.expect(pm.request.headers.get('X-Student-Id')).to.eql(pm.environment.get('studentId')));
      pm.test(testId + ' | response time under 2000 ms', () => pm.expect(pm.response.responseTime).to.be.below(2000));
      pm.test(testId + ' | no unexpected 5xx', () => pm.expect(pm.response.code).to.be.below(500));
      let json = null;
      try { json = pm.response.json(); } catch (_) {}
    language: text/javascript
order: 12000
